name: Release

# Cross-platform release builds. Triggered on git tags starting with "v" (e.g.
# v0.10.0) or manually from the Actions tab. Produces:
#   - Windows: GenOffice Setup x.x.x.exe (NSIS, ~140 MB)
#   - macOS:   GenOffice-x.x.x-arm64.dmg (~120 MB)
#   - Linux:   genoffice_x.x.x_amd64.deb (optional, ~120 MB)
#
# Required repository secrets for code-signing / notarization (all optional):
#   - WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD  : Windows code-signing cert (.pfx)
#   - MAC_CSC_LINK + MAC_CSC_KEY_PASSWORD  : macOS Developer ID cert (.p12)
#   - APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID : notarization
#   - GH_TOKEN (auto-provided by GitHub Actions)               : upload to release
#
# Without secrets, builds produce UNSIGNED artifacts (warning, not error).
# Forks that don't have these secrets will still build — they just won't be signed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.10.0). Leave empty to use package.json.'
        required: false
        default: ''

permissions:
  contents: write   # required to create the GitHub Release
  actions: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_glob: 'apps/shell/release/GenOffice Setup *.exe'
            artifact_name: windows-installer
            target: win
          - os: macos-14   # Apple Silicon runner
            artifact_glob: 'apps/shell/release/GenOffice-*.dmg'
            artifact_name: macos-dmg
            target: mac
          # - os: ubuntu-latest
          #   artifact_glob: 'apps/shell/release/genoffice_*.deb'
          #   artifact_name: linux-deb
          #   target: linux

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      # macOS needs the Apple targets explicitly for cross-compile / universal binaries
      - name: Add Rust targets (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.1
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-bin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-bin-${{ runner.os }}-

      - name: Install npm dependencies
        # 上游 CI 的 npm ci 不会触发 duplicate dep 引用,只有 npm install + legacy-peer-deps
        # 才触发。说明 lock 文件本身没事,是 install 在某些条件下才坏。
        # 保持 npm ci 跟上游一致。
        run: npm ci

      # macOS requires explicit npm scripts for universal binary + DMG signing
      - name: Pre-build (macOS universal sidecar)
        if: runner.os == 'macOS'
        run: |
          npm run native:build:universal -w @genoffice/sheets || echo "Universal build not configured, using default"

      - name: Build all packages
        run: npm run build:all
        env:
          # Don't sign in CI builds unless secrets are present
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # electron-builder auto-detects target from runner.os. Override here if needed.
      - name: Build installer (${{ matrix.target }})
        # electron-builder 26.x 在 monorepo 下检测到 duplicate dependency references 后
        # 会触发 asar integrity sanity check 失败。属性名是 disableSanityCheckAsar。
        # 加 CSC_IDENTITY_AUTO_DISCOVERY=false + 跳过 asar sanity check
        #
        # macOS: 显式 --arm64 只产 Apple Silicon dmg (M1/M2/M3/M4 全支持),
        # 不产 Intel x64 版本 (用户需求"M1 以后"=纯 arm64)。
        # 如果以后要 Intel 支持,在 macos job 上加 --x64,需要 native:build:universal。
        run: |
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --${{ matrix.target }} \
            --publish never \
            --config.disableSanityCheckAsar=true \
            ${{ matrix.target == 'mac' && '--arm64' || '' }}
        env:
          # GH_TOKEN unset → don't try to upload from per-build job
          GH_TOKEN: ''
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Skip Windows signtool (no signing cert in this template)
          # GENOFFICE_WIN_SIGN_MODE: 'test'  # uncomment + provide WIN_CSC_LINK to enable
          # Skip notarization for forks / first runs
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: List output artifacts
        if: always()
        run: |
          echo "=== apps/shell/release/ ==="
          ls -la apps/shell/release/ 2>&1 | head -30

      - name: Upload artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts

      - name: Show downloaded artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@2d7d6934aac9920d188e6b40b65af3a83cdcd09e # v2.3.2
        with:
          tag_name: ${{ github.ref_name }}
          name: GenOffice ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/windows-installer/*
            artifacts/macos-dmg/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
