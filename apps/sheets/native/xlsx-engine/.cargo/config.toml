# Force GNU toolchain for xlsx-engine so we don't depend on the broken MSVC
# toolchain (link.exe etc.) on the local machine.
#
# NOTE: this config is invoked via `cargo --config <path>`, which merges sections
# rather than replacing them, so we use `[target.<triple>]` keys to point the
# linker at MinGW-w64's gcc.exe. The actual target selection happens via the
# CARGO_TARGET environment variable (CARGO_TARGET_DIR is unrelated; we need
# CARGO_BUILD_TARGET to switch triples on a per-invocation basis).
[target.x86_64-pc-windows-gnu]
linker = "D:/Workspace Hermes/msys64/msys64/mingw64/bin/gcc.exe"
ar = "D:/Workspace Hermes/msys64/msys64/mingw64/bin/ar.exe"
